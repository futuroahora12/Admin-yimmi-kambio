name: Build APK Yimmi Kambio Admin

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: 'Version Code (entero, ej. 1)'
        required: false
        default: '1'
      version_name:
        description: 'Version Name (ej. 1.0.0)'
        required: false
        default: '1.0.0'

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Prepare web assets (www)
        run: |
          mkdir -p www
          if [ -f "index.html" ]; then
            cp index.html www/index.html
          fi

      - name: Install dependencies & sync Capacitor
        run: |
          if [ -f "package.json" ]; then
            npm ci || npm install
          fi
          if [ -f "capacitor.config.json" ] || [ -f "capacitor.config.ts" ]; then
            npx cap sync android
          fi

      - name: Generate Yimmi Kambio app icons from logo
        if: hashFiles('android/app/src/main/res') != ''
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq python3-pil
          curl -sSL "https://i.postimg.cc/t4fJptrQ/BCV-20261120-041842-0000.png" -o /tmp/yimmi_logo.png
          python3 - << 'EOF'
          from PIL import Image
          import os

          src = Image.open("/tmp/yimmi_logo.png").convert("RGBA")
          sizes = {
              "mipmap-mdpi": 48,
              "mipmap-hdpi": 72,
              "mipmap-xhdpi": 96,
              "mipmap-xxhdpi": 144,
              "mipmap-xxxhdpi": 192,
          }

          res_dir = "android/app/src/main/res"
          for folder, px in sizes.items():
              out_dir = os.path.join(res_dir, folder)
              os.makedirs(out_dir, exist_ok=True)
              icon = src.resize((px, px), Image.Resampling.LANCZOS)
              icon.save(os.path.join(out_dir, "ic_launcher.png"))
              icon.save(os.path.join(out_dir, "ic_launcher_round.png"))
              icon.save(os.path.join(out_dir, "ic_launcher_foreground.png"))

          print("Iconos de Yimmi Kambio generados correctamente.")
          EOF

      - name: Update versionCode and versionName in build.gradle
        if: hashFiles('android/app/build.gradle') != ''
        run: |
          VC="${{ github.event.inputs.version_code }}"
          VN="${{ github.event.inputs.version_name }}"
          sed -i "s/versionCode [0-9]\+/versionCode ${VC}/g" android/app/build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"${VN}\"/g" android/app/build.gradle

      - name: Build Debug APK
        if: hashFiles('android/gradlew') != ''
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Debug APK artifact
        if: hashFiles('android/app/build/outputs/apk/debug/app-debug.apk') != ''
        uses: actions/upload-artifact@v4
        with:
          name: Yimmi-Kambio-Admin-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
